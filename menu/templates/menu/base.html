{% load static %}
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ონლაინ რესტორანი{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'menu/css/style.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="{% url 'dish_list' %}" class="brand">🍽️ Tasty&nbsp;Table</a>
            <nav class="nav-links">
                <a href="{% url 'dish_list' %}">მენიუ</a>
                <a href="{% url 'cart_detail' %}" class="cart-link">
                    კალათა
                    <span class="cart-badge">{{ cart_count }}</span>
                </a>
            </nav>
        </div>
    </header>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="page">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 Tasty Table &mdash; საკურსო პროექტი Django-ზე</p>
    </footer>
</body>
</html>
